version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: payment_ledger_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ledger_secret_password
      POSTGRES_DB: ledger_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_user -d ledger_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ledger-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment_ledger_service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "ledger_user"
      DB_PASSWORD: "ledger_secret_password"
      DB_NAME: "ledger_db"
      DB_SSLMODE: "disable"
      DB_MAX_CONNS: "30"
      DB_MIN_CONNS: "5"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
